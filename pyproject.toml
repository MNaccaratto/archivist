[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "archivist"
version = "0.1.0"
description = "Safely sort messy folders into a tidy structure, with dry-run and undo."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
archivist = "archivist.cli:main"

[tool.setuptools]
packages = ["archivist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
